<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe App — Test Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Archivo+Expanded:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="recipe.css">
</head>
<body>
<div class="wrap">
  <div class="label">
    <div class="eyebrow">Diagnostics</div>
    <h1>Test Suite</h1>
    <p class="description">Checks the rendering logic, all three recipe files, and cross-recipe storage isolation. Re-run this any time after changing recipe.js or a recipe JSON file — just reload this page.</p>
  </div>
  <div id="summary"></div>
  <section>
    <div class="sec-head"><h2>Results</h2><div class="rule"></div></div>
    <div id="results"></div>
  </section>
  <footer>RUNS ENTIRELY IN THIS BROWSER — NO DATA SENT ANYWHERE</footer>
</div>
<script src="recipe.js"></script>
<script>
const results = [];

function test(name, fn){
  try{ fn(); results.push({ name, group: currentGroup, pass: true }); }
  catch(e){ results.push({ name, group: currentGroup, pass: false, error: e.message }); }
}
async function testAsync(name, fn){
  try{ await fn(); results.push({ name, group: currentGroup, pass: true }); }
  catch(e){ results.push({ name, group: currentGroup, pass: false, error: e.message }); }
}
function assertEqual(actual, expected, msg){
  if(actual !== expected) throw new Error(`${msg||''} expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
}
function assertTrue(cond, msg){ if(!cond) throw new Error(msg || 'expected true'); }
function assertContains(str, substr, msg){
  if(!String(str).includes(substr)) throw new Error(`${msg||''} expected to contain "${substr}", got "${str}"`);
}

let currentGroup = 'Unit';

/* ---------------- UNIT TESTS (pure functions, no network) ---------------- */

test('escapeHtml escapes special characters', () => {
  assertEqual(escapeHtml(`<script>&"'`), '&lt;script&gt;&amp;&quot;&#39;');
});

test('formatStepBody bolds a temperature', () => {
  assertContains(formatStepBody('Roast at 200°C fan.'), '<strong>200°C</strong>');
});

test('formatStepBody bolds a time range', () => {
  assertContains(formatStepBody('Wait 12-24 hours.'), '<strong>12-24 hours</strong>');
});

test('formatStepBody bolds a weight', () => {
  assertContains(formatStepBody('Add 75 g salt.'), '<strong>75 g</strong>');
});

test('formatStepBody bolds a dimension', () => {
  assertContains(formatStepBody('Leave 2.5cm headspace.'), '<strong>2.5cm</strong>');
});

test('formatStepBody leaves plain text with no measurements untouched', () => {
  assertEqual(formatStepBody('Mix well.'), 'Mix well.');
});

test('formatIngredientName lightens parenthetical substitution text', () => {
  assertContains(formatIngredientName('Fish sauce (or vegetarian)'), '<span class="ing-sub">or vegetarian</span>');
});

test('renderIngredientAmount shows the crafted display string at 1x', () => {
  const item = { name:'Garlic', amount:7.5, unit:'cloves', scaleMode:'whole_range', display:'7-8 cloves' };
  assertEqual(renderIngredientAmount(item, 1), '7-8 cloves');
});

test('renderIngredientAmount rounds to a whole number once scaled (the "7.5 cloves" fix)', () => {
  const item = { name:'Garlic', amount:7.5, unit:'cloves', scaleMode:'whole_range', display:'7-8 cloves' };
  const out = renderIngredientAmount(item, 1.5);
  assertTrue(/^\d+ cloves$/.test(out), `expected a whole-number result, got "${out}"`);
});

test('renderIngredientAmount scales a weight precisely', () => {
  const item = { name:'Squash', amount:250, unit:'g', scaleMode:'weight' };
  assertEqual(renderIngredientAmount(item, 1.5), '375 g');
});

test('renderIngredientAmount returns empty string for free-text items with no amount', () => {
  const item = { name:'Leftover paella, enough to fill the tomatoes' };
  assertEqual(renderIngredientAmount(item, 1), '');
});

test('validateRecipe rejects a recipe with no title', () => {
  const errs = validateRecipe({ ingredients:[{id:'a',title:'A',items:[]}], steps:[{number:1,body:'x'}] });
  assertTrue(errs.some(e => e.includes('title')));
});

test('validateRecipe rejects a recipe with no ingredients', () => {
  const errs = validateRecipe({ title:'X', steps:[{number:1,body:'x'}] });
  assertTrue(errs.some(e => e.includes('ingredients')));
});

test('validateRecipe rejects a recipe with no steps', () => {
  const errs = validateRecipe({ title:'X', ingredients:[{id:'a',title:'A',items:[]}] });
  assertTrue(errs.some(e => e.includes('steps')));
});

test('validateRecipe accepts a minimal valid recipe', () => {
  const errs = validateRecipe({ title:'X', ingredients:[{id:'a',title:'A',items:[{name:'Salt'}]}], steps:[{number:1,body:'Mix.'}] });
  assertEqual(errs.length, 0, `unexpected errors: ${errs.join('; ')}`);
});

test('stageForDay returns the correct fermentation stage at each boundary', () => {
  const stages = [
    { id:'early', label:'Early', fromDay:0, toDay:2, colour:'yellow' },
    { id:'peak',  label:'Peak',  fromDay:3, toDay:14, colour:'green' },
    { id:'past',  label:'Past',  fromDay:15, colour:'amber' }
  ];
  assertEqual(stageForDay(stages, 2).id, 'early');
  assertEqual(stageForDay(stages, 3).id, 'peak');
  assertEqual(stageForDay(stages, 14).id, 'peak');
  assertEqual(stageForDay(stages, 15).id, 'past');
  assertEqual(stageForDay(stages, 100).id, 'past');
});

test('formatDuration formats under an hour as mm:ss', () => {
  assertEqual(formatDuration(90, false), '01:30');
});

test('formatDuration formats over an hour as hh:mm:ss', () => {
  assertEqual(formatDuration(3661, true), '01:01:01');
});

test('gauge zone widths tile contiguously and sum to exactly 100% (regression: previously left gaps at every boundary)', () => {
  const stages = [
    { id:'early', label:'Fresh', fromDay:0, toDay:2, colour:'yellow' },
    { id:'peak',  label:'Best',  fromDay:3, toDay:14, colour:'green' },
    { id:'past',  label:'Past',  fromDay:15, toDay:20, colour:'amber' },
    { id:'avoid', label:'Avoid', fromDay:21, colour:'red' }
  ];
  const maxToDay = maxTrackerDay(stages);
  const html = renderGauge(stages, maxToDay);
  const widths = [...html.matchAll(/flex:0 0 ([\d.]+)%/g)].map(m => parseFloat(m[1]));
  assertEqual(widths.length, 4, 'expected one zone per stage');
  const sum = widths.reduce((a,b)=>a+b, 0);
  assertTrue(Math.abs(sum - 100) < 0.01, `zone widths should sum to 100%, got ${sum}`);
});

test('axis label positions exactly match gauge zone boundary starts (regression: previously used even spacing instead of true day position)', () => {
  const stages = [
    { id:'early', label:'Fresh', fromDay:0, toDay:2, colour:'yellow' },
    { id:'peak',  label:'Best',  fromDay:3, toDay:14, colour:'green' },
    { id:'past',  label:'Past',  fromDay:15, toDay:20, colour:'amber' },
    { id:'avoid', label:'Avoid', fromDay:21, colour:'red' }
  ];
  const maxToDay = maxTrackerDay(stages);
  const widths = [...renderGauge(stages, maxToDay).matchAll(/flex:0 0 ([\d.]+)%/g)].map(m => parseFloat(m[1]));
  let cumulative = 0;
  const boundaryStarts = widths.map(w => { const s = cumulative; cumulative += w; return s; });
  const axisPositions = [...renderAxis(stages, maxToDay).matchAll(/left:([\d.]+)%/g)].map(m => parseFloat(m[1]));
  boundaryStarts.forEach((b, i) => {
    assertTrue(Math.abs(b - axisPositions[i]) < 0.01, `axis label ${i} at ${axisPositions[i]}% should match zone boundary at ${b}%`);
  });
});

test('text size cycles through all five steps and wraps around', () => {
  setStoredTextScale(100);
  const seen = [];
  for(let i = 0; i < 5; i++){ cycleTextScale(); seen.push(getStoredTextScale()); }
  assertEqual(JSON.stringify(seen), JSON.stringify([112.5, 125, 137.5, 87.5, 100]), `unexpected cycle order: ${seen.join(', ')}`);
});

test('nextIngState cycles unmarked → have → check → buy → unmarked', () => {
  const seq = ['null'];
  for(let i = 0; i < 4; i++) seq.push(nextIngState(seq[seq.length - 1]));
  assertEqual(JSON.stringify(seq), JSON.stringify(['null','have','check','buy','null']), `unexpected cycle: ${seq.join(', ')}`);
});

test('ingStatusKey produces a stable, group-and-index-scoped key', () => {
  assertEqual(ingStatusKey('raw', 3), 'ing-status:raw:3');
  assertEqual(ingStatusKey('binding-paste', 0), 'ing-status:binding-paste:0');
});

/* ---------------- INTERFACE TESTS (cross-recipe storage isolation) ---------------- */

currentGroup = 'Interface';

test('timers are namespaced per recipe and do not collide', () => {
  sSet('__test_recipe_a', 'timer:t1', { endTs: 111 });
  sSet('__test_recipe_b', 'timer:t1', { endTs: 222 });
  assertEqual(sGet('__test_recipe_a','timer:t1').endTs, 111);
  assertEqual(sGet('__test_recipe_b','timer:t1').endTs, 222);
  sDelete('__test_recipe_a','timer:t1');
  sDelete('__test_recipe_b','timer:t1');
});

test('fermentation tracker start times are namespaced per recipe', () => {
  sSet('__test_recipe_a', 'batch-start', { startTs: 1000 });
  sSet('__test_recipe_b', 'batch-start', { startTs: 2000 });
  assertEqual(sGet('__test_recipe_a','batch-start').startTs, 1000);
  assertEqual(sGet('__test_recipe_b','batch-start').startTs, 2000);
  sDelete('__test_recipe_a','batch-start');
  sDelete('__test_recipe_b','batch-start');
});

test('batch multiplier persists per recipe (survives navigating away and back)', () => {
  sSet('__test_recipe_a', 'batch-multiplier', 1.5);
  assertEqual(sGet('__test_recipe_a','batch-multiplier'), 1.5, 'multiplier should be readable back exactly as saved');
  sDelete('__test_recipe_a','batch-multiplier');
  assertEqual(sGet('__test_recipe_a','batch-multiplier'), null, 'should be gone after reset');
});

test('step completion is namespaced per recipe and persists', () => {
  sSet('__test_recipe_a', 'step-done:3', true);
  assertTrue(!!sGet('__test_recipe_a','step-done:3'), 'step 3 should be marked done for recipe a');
  assertTrue(!sGet('__test_recipe_b','step-done:3'), 'the same step number on a different recipe should be unaffected');
  sDelete('__test_recipe_a','step-done:3');
});

test('ingredient status is namespaced per recipe and does not collide', () => {
  sSet('__test_recipe_a', ingStatusKey('raw', 0), 'have');
  sSet('__test_recipe_b', ingStatusKey('raw', 0), 'buy');
  assertEqual(sGet('__test_recipe_a', ingStatusKey('raw', 0)), 'have');
  assertEqual(sGet('__test_recipe_b', ingStatusKey('raw', 0)), 'buy');
  sDelete('__test_recipe_a', ingStatusKey('raw', 0));
  sDelete('__test_recipe_b', ingStatusKey('raw', 0));
});

test('marked ingredient renders its badge and fades the row; Reset clears every marked ingredient', () => {
  const slug = '__test_ing_render';
  sSet(slug, ingStatusKey('raw', 0), 'buy');
  sSet(slug, ingStatusKey('raw', 1), 'have');
  const root = document.createElement('div');
  document.body.appendChild(root);
  const recipe = {
    title: 'Test', ingredients: [{ id:'raw', title:'Raw', items:[{name:'Item A'},{name:'Item B'},{name:'Item C'}] }],
    steps: [{ number:1, body:'Do a thing.' }]
  };
  renderRecipe(recipe, slug, root);
  const rowA = root.querySelectorAll('.ing-row')[0];
  const rowB = root.querySelectorAll('.ing-row')[1];
  assertTrue(rowA.querySelector('.state-buy') !== null, 'Item A should show a BUY badge');
  assertTrue(rowB.classList.contains('done'), 'Item B (have) should get the faded done class');
  assertTrue(rowA.getAttribute('aria-label').includes('buy'), 'row should carry an aria-label reflecting its state');
  root.querySelector('#ingResetBtn').click();
  assertEqual(sGet(slug, ingStatusKey('raw', 0)), null, 'Reset should clear item A');
  assertEqual(sGet(slug, ingStatusKey('raw', 1)), null, 'Reset should clear item B');
  document.body.removeChild(root);
  sDelete(slug, ingStatusKey('raw', 0)); sDelete(slug, ingStatusKey('raw', 1));
});

/* ---------------- INTEGRATION TESTS (fetch the real files) ---------------- */

currentGroup = 'Integration';

async function runIntegrationTests(){
  const recipeFiles = ['kimchi', 'paella-stuffed-tomatoes', 'fancy-housemade-soda'];

  for(const slug of recipeFiles){
    await testAsync(`recipes/${slug}.json loads and passes schema validation`, async () => {
      const res = await fetch(`../recipes/${slug}.json`);
      assertTrue(res.ok, `HTTP ${res.status}`);
      const data = await res.json();
      const errs = validateRecipe(data);
      assertEqual(errs.length, 0, errs.join('; '));
    });
  }

  await testAsync('kimchi steps all carry a component tag (Binding Paste / Kimchi Prep / Kimchi Fermentation)', async () => {
    const res = await fetch('../recipes/kimchi.json');
    const data = await res.json();
    const missing = data.steps.filter(s => !s.component).map(s => s.number);
    assertTrue(missing.length === 0, `steps missing a component tag: ${missing.join(', ')}`);
    const distinctComponents = [...new Set(data.steps.map(s => s.component))];
    assertEqual(distinctComponents.length, 3, `expected 3 distinct components, got: ${distinctComponents.join(', ')}`);
  });

  await testAsync('manifest.json loads and every listed recipe file actually exists', async () => {
    const res = await fetch('../recipes/manifest.json');
    assertTrue(res.ok, `HTTP ${res.status}`);
    const manifest = await res.json();
    assertTrue(Array.isArray(manifest.recipes) && manifest.recipes.length > 0, 'manifest has no recipes listed');
    for(const r of manifest.recipes){
      const rres = await fetch(`../recipes/${r.slug}.json`);
      assertTrue(rres.ok, `recipes/${r.slug}.json referenced in manifest but not found (HTTP ${rres.status})`);
    }
  });
}

/* ---------------- render ---------------- */

function renderResults(){
  const passCount = results.filter(r=>r.pass).length;
  const failCount = results.length - passCount;
  document.getElementById('summary').innerHTML = `<div class="stats">
    <div class="stat"><b style="color:var(--cabbage-deep)">${passCount}</b><span>Passed</span></div>
    <div class="stat"><b style="color:${failCount?'var(--gochugaru)':'inherit'}">${failCount}</b><span>Failed</span></div>
    <div class="stat"><b>${results.length}</b><span>Total</span></div>
  </div>`;

  const groups = [...new Set(results.map(r=>r.group))];
  document.getElementById('results').innerHTML = groups.map(g => `
    <div class="card">
      <h3>${g}</h3>
      ${results.filter(r=>r.group===g).map(r => `
        <div class="ing-row">
          <span>${r.pass ? '✅' : '❌'} ${r.name}</span>
        </div>
        ${r.error ? `<div class="ing-row" style="border:none; padding-top:0;"><span style="color:var(--gochugaru-deep); font-size:12px;">${r.error}</span></div>` : ''}
      `).join('')}
    </div>`).join('');
}

(async function main(){
  await runIntegrationTests();
  renderResults();
})();
</script>
</body>
</html>
